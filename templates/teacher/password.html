{% extends 'teacher/base.html' %}

{% block title %}Change Password{% endblock %}

{% block content %}

<h1>Change Password</h1>

<p class="muted">
    Enter your current password, including the first password supplied to you.
</p>

<form method="post" class="panel password-form">

    <input type="hidden"
           name="csrf_token"
           value="{{ csrf_token() }}">

    <label>
        Current password

        <input type="password"
               name="current_password"
               autocomplete="current-password"
               required>
    </label>

    <label>
        New password

        <input type="password"
               name="new_password"
               minlength="8"
               autocomplete="new-password"
               required>
    </label>

    <label>
        Confirm new password

        <input type="password"
               name="confirm_password"
               minlength="8"
               autocomplete="new-password"
               required>
    </label>

    <button>Change password</button>

</form>

{% endblock %}
