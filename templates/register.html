{% extends "base.html" %}

{% block title %}Register · Smart Campus{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <span class="eyebrow">JOIN YOUR CLASS</span>
        <h1>Create account</h1>

        <p class="muted">
            Register your personal student account.
        </p>

        <form method="post" class="stack">
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <label>
                Full name

                <input
                    name="name"
                    placeholder="Your full name"
                    autocomplete="name"
                    required
                >
            </label>

            <label>
                Student ID

                <input
                    name="student_no"
                    placeholder="e.g. 2026-001"
                    required
                >
            </label>

            <label>
                Email address

                <input
                    type="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </label>

            <label>
                Password

                <input
                    type="password"
                    name="password"
                    minlength="8"
                    placeholder="At least 8 characters"
                    autocomplete="new-password"
                    required
                >
            </label>

            <button type="submit" class="btn btn-primary btn-full">
                Register account →
            </button>
        </form>

        <p class="auth-bottom">
            Already registered?
            <a href="{{ url_for('login') }}">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
