{% if campus_notices %}

<section class="panel campus-notice-list"
         aria-label="My notices">

    <h2>My Notices</h2>

    {% for notice in campus_notices %}

    <details class="campus-notice" open>

        <summary>
            <span class="campus-notice-heading">
                <strong>{{ notice.title }}</strong>

                <small>
                    {{ notice.created_at[:16]|replace('T', ' ') }}
                </small>
            </span>
        </summary>

        <div class="campus-notice-body">{{ notice.body }}</div>

    </details>

    {% endfor %}

</section>

{% endif %}
