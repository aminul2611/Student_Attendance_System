{% if campus_notices %}

<section class="panel" aria-label="My notices">

    <h2>My Notices</h2>

    {% for notice in campus_notices %}

    <details style="padding:14px 0; border-top:1px solid #e7ebf0">

        <summary>

            {{ notice.title }}

            <small>
                {{ notice.created_at[:16]|replace('T',' ') }}
            </small>

        </summary>

        <p style="white-space:pre-wrap; overflow-wrap:anywhere; margin-top:8px">{{ notice.body }}</p>

    </details>

    {% endfor %}

</section>

{% endif %}
