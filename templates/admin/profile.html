{% extends 'admin/base.html' %}

{% block title %}Admin Profile{% endblock %}

{% block content %}

<h1>My Profile</h1>
<p class="muted">Update your name and password.</p>

<div class="admin-forms admin-profile-grid">

    <form class="panel form-card"
          method="post"
          action="{{ url_for('admin_portal.profile') }}"
          data-ajax-form
          data-message="name-message">

        <h2>Profile details</h2>

        <p id="name-message"
           class="notice"
           role="status"
           aria-live="polite"
           hidden></p>

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <input type="hidden"
               name="action"
               value="name">

        <label>
            Full name

            <input name="name"
                   value="{{ g.user.name }}"
                   maxlength="100"
                   required>
        </label>

        <label>
            Email

            <input type="email"
                   value="{{ g.user.email }}"
                   readonly>
        </label>

        <button type="submit">Save profile</button>

    </form>

    <form class="panel form-card"
          method="post"
          action="{{ url_for('admin_portal.profile') }}"
          data-ajax-form
          data-message="password-message"
          data-reset="password">

        <h2>Change password</h2>

        <p id="password-message"
           class="notice"
           role="status"
           aria-live="polite"
           hidden></p>

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <input type="hidden"
               name="action"
               value="password">

        <label>
            Current password

            <input type="password"
                   name="current_password"
                   autocomplete="current-password"
                   required>
        </label>

        <label>
            New password

            <input type="password"
                   name="new_password"
                   minlength="8"
                   maxlength="128"
                   autocomplete="new-password"
                   required>
        </label>

        <label>
            Confirm new password

            <input type="password"
                   name="confirm_password"
                   minlength="8"
                   maxlength="128"
                   autocomplete="new-password"
                   required>
        </label>

        <button type="submit">Change password</button>

    </form>

</div>

<script src="{{ url_for('static', filename='admin/forms.js') }}"
        defer></script>

{% endblock %}
