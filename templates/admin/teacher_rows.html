{% for teacher in teachers %}

<tr data-teacher-row
    data-search="{{ teacher.name }} {{ teacher.email }} {{ teacher.department or '' }}">

    <td>
        <div class="teacher-person">

            <span class="teacher-avatar" aria-hidden="true">
                {{ teacher.name[:1]|upper }}
            </span>

            <div>
                <strong>{{ teacher.name }}</strong>
                <small>Teacher account</small>
            </div>

        </div>
    </td>

    <td>
        <span class="teacher-email">
            {{ teacher.email }}
        </span>
    </td>

    <td>
        <span class="teacher-department">
            {{ teacher.department or 'Not set' }}
        </span>
    </td>

    <td>
        <a class="button secondary teacher-detail-link"
           href="{{ url_for('admin_portal.teacher_teaching', teacher_id=teacher.id) }}">
            Details →
        </a>
    </td>

    <td>
        <a class="button secondary teacher-settings-link"
           href="{{ url_for('admin_portal.teacher_account', teacher_id=teacher.id) }}">
            Settings
        </a>
    </td>

    <td>
        <form method="post"
              action="{{ url_for('admin_portal.set_teacher_status', teacher_id=teacher.id) }}"
              class="teacher-toggle-form"
              data-teacher-form
              data-message="teacher-status-message">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <input type="hidden"
                   name="active"
                   value="{{ '0' if teacher.active else '1' }}">

            <button type="submit"
                    class="teacher-toggle {{ 'is-active' if teacher.active else 'is-inactive' }}"
                    aria-label="{{ 'Disable' if teacher.active else 'Enable' }} {{ teacher.name }}"
                    title="{{ 'Click to disable' if teacher.active else 'Click to enable' }}">

                <span class="toggle-dot" aria-hidden="true"></span>

                {{ 'Active' if teacher.active else 'Inactive' }}

            </button>

        </form>
    </td>

</tr>

{% endfor %}

<tr id="teacher-no-match"
    {% if teachers %}hidden{% endif %}>

    <td colspan="6">
        <div class="teacher-empty">
            <span aria-hidden="true">♙</span>
            <strong>No teachers found</strong>
            <p>Add a teacher or try another search.</p>
        </div>
    </td>

</tr>
